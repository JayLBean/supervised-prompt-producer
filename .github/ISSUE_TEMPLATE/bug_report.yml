name: Bug report
description: Something in the spp plugin behaves incorrectly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a suspected **security** vulnerability, do not file
        here — follow [`SECURITY.md`](https://github.com/JayLBean/supervised-prompt-producer/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did spp do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Which phase (init / baseline / loop / finalize), the task mode, and the exact actions.
      placeholder: |
        1. Ran /spp:run on <task> ...
        2. At the loop phase ...
        3. Observed ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: spp version
      description: From `.claude-plugin/plugin.json`, or `git rev-parse --short HEAD` for a local checkout.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: task-model
    attributes:
      label: Task model
      description: The model spp was pointed at (e.g. gpt-5-nano, or a local server).
    validations:
      required: false
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant artifacts or logs
      description: A `plan.md` excerpt, an iteration's eval/discrepancy, or a stack trace. Redact anything sensitive.
      render: shell
    validations:
      required: false
